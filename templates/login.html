{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 border border-gray-100 rounded-xl shadow-sm">
    <h2 class="text-2xl font-bold text-gray-900 text-center mb-6">Sign In to Medi Track</h2>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" name="username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
        </div>

        <button type="submit" class="w-full bg-brand-600 text-white font-medium py-2.5 rounded-lg hover:bg-brand-700 transition">
            Sign In
        </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-600">
        Don't have an account? <a href="{% url 'register' %}" class="text-brand-600 font-medium hover:underline">Register here</a>
    </div>

    <!-- Demo Credentials Helper -->
    <div class="mt-8 p-4 bg-gray-50 border border-gray-200 rounded-lg text-xs text-gray-600">
        <p class="font-semibold text-gray-800 mb-1">Demo Accounts:</p>
        <ul class="space-y-1">
            <li><strong>Doctor:</strong> doctor1 / password123</li>
            <li><strong>Patient:</strong> patient1 / password123</li>
            <li><strong>Admin:</strong> admin / admin123</li>
        </ul>
    </div>
</div>
{% endblock %}
