{% extends 'base.html' %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 border border-gray-100 rounded-xl shadow-sm">
    <h2 class="text-2xl font-bold text-gray-900 text-center mb-6">Create an Account</h2>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                <input type="text" name="first_name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                <input type="text" name="last_name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" name="username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Account Type</label>
            <select name="role" id="roleSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none bg-white">
                <option value="patient" selected>Patient</option>
                <option value="doctor">Doctor</option>
            </select>
        </div>

        <!-- Patient Specific Fields (Shown for Patient) -->
        <div id="patient_fields" class="space-y-4 pt-2 border-t border-gray-100">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Age <span class="text-xs text-gray-400 font-normal">(Years)</span>
                </label>
                <input type="number" name="age" min="1" max="120" placeholder="e.g. 28" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Previous Medical History <span class="text-xs text-gray-400 font-normal">(Optional)</span>
                </label>
                <textarea name="previous_medical_history" rows="3" placeholder="e.g. Asthma since childhood. Hypertension, past surgeries, or allergies..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none text-sm"></textarea>
                <span class="text-xs text-gray-400">Leave blank if you have no relevant past medical history.</span>
            </div>
        </div>

        <!-- Doctor Specific Fields (Shown for Doctor) -->
        <div id="doctor_spec_field" class="hidden pt-2 border-t border-gray-100">
            <label class="block text-sm font-medium text-gray-700 mb-1">Medical Specialization</label>
            <input type="text" name="specialization" placeholder="e.g. General Physician, Cardiologist, Pediatrician" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
        </div>

        <button type="submit" class="w-full bg-brand-600 text-white font-medium py-2.5 rounded-lg hover:bg-brand-700 transition shadow-sm">
            Sign Up
        </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-600">
        Already have an account? <a href="{% url 'login' %}" class="text-brand-600 font-medium hover:underline">Sign In</a>
    </div>
</div>

<script>
    const roleSelect = document.getElementById('roleSelect');
    const doctorField = document.getElementById('doctor_spec_field');
    const patientFields = document.getElementById('patient_fields');

    roleSelect.addEventListener('change', function() {
        if (this.value === 'doctor') {
            doctorField.classList.remove('hidden');
            patientFields.classList.add('hidden');
        } else {
            doctorField.classList.add('hidden');
            patientFields.classList.remove('hidden');
        }
    });
</script>
{% endblock %}
